name: Validate Countries provider

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the pinned geo recipe inputs
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eu
          revision="$(python3 -c 'import json; print(json.load(open("manifest.json"))["source"]["revision"])')"
          source_dir="$RUNNER_TEMP/datatug-demo-project"
          git init -q "$source_dir"
          git -C "$source_dir" sparse-checkout set --no-cone '/demo-project-1/data/geo/'
          git -C "$source_dir" fetch --quiet --depth=1 --filter=blob:none 'https://github.com/datatug/datatug-demo-project.git' "$revision"
          git -C "$source_dir" checkout -q --detach "$revision"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$revision"

      - name: Verify the pinned SQLite source rebuild
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: python3 scripts/rebuild-source.py --geo "$RUNNER_TEMP/datatug-demo-project/demo-project-1/data/geo" --check

      - name: Install the immutable shared provider generator
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eu
          base="https://raw.githubusercontent.com/demo-db/websites/9cc80d98fbb63bf4c24593db4779ea4bd31ccef7"
          curl --fail --silent --show-error --location "$base/scripts/provider-tools/generate.py" -o "$RUNNER_TEMP/generate-provider.py"
          printf '%s  %s\n' 'b8f97f68ea4886277649fb42cf28ec7539873e695f9eebeb70c32660745b10ef' "$RUNNER_TEMP/generate-provider.py" | sha256sum --check
          curl --fail --silent --show-error --location "$base/schemas/ovdb-database-draft-1.schema.json" -o "$RUNNER_TEMP/ovdb-database-draft-1.schema.json"
          printf '%s  %s\n' '4af5dc5f48bce1bc2ba5cb6664dd2c28adcadd818c74da0e78fe428f6f6ec55b' "$RUNNER_TEMP/ovdb-database-draft-1.schema.json" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/provider-generator/scripts/provider-tools" "$RUNNER_TEMP/provider-generator/schemas"
          cp "$RUNNER_TEMP/generate-provider.py" "$RUNNER_TEMP/provider-generator/scripts/provider-tools/generate.py"
          cp "$RUNNER_TEMP/ovdb-database-draft-1.schema.json" "$RUNNER_TEMP/provider-generator/schemas/ovdb-database-draft-1.schema.json"

      - name: Regenerate provider contracts and exports
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: python3 "$RUNNER_TEMP/provider-generator/scripts/provider-tools/generate.py" --root .

      - name: Install pinned ModelSpec and MeaningGraph tools
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/countries-tools"
          curl --fail --silent --show-error --location 'https://github.com/modelspec-org/cli/releases/download/v0.2.0/modelspec_0.2.0_linux_amd64.tar.gz' -o "$RUNNER_TEMP/modelspec.tar.gz"
          printf '%s  %s\n' '95b999570c633a4eba07014dccaf31dc71cfc9e9e7711c3cc254cb377bc2ddbc' "$RUNNER_TEMP/modelspec.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/modelspec.tar.gz" -C "$RUNNER_TEMP/countries-tools" modelspec
          curl --fail --silent --show-error --location 'https://github.com/meaninggraph/cli/releases/download/v0.3.0/meaninggraph_0.3.0_linux_amd64.tar.gz' -o "$RUNNER_TEMP/meaninggraph.tar.gz"
          printf '%s  %s\n' 'f8073b9ab5547551e00d021fcd83c4ff52c4a49034f9ee5719512dfade9afdf8' "$RUNNER_TEMP/meaninggraph.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/meaninggraph.tar.gz" -C "$RUNNER_TEMP/countries-tools" meaninggraph

      - name: Validate the published ModelSpec and HCL export
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/countries-tools/modelspec" lint --profile publish model
          "$RUNNER_TEMP/countries-tools/modelspec" export --check model/countries.modelspec.hcl model/countries.modelspec.json

      - name: Validate the pinned MeaningGraph and embedded schema
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eu
          core="$(python3 -c 'import json; print(json.load(open("manifest.json"))["generator"]["meaning"]["core"]["revision"])')"
          core_dir="$RUNNER_TEMP/meaninggraph-core"
          git init -q "$core_dir"
          git -C "$core_dir" fetch --quiet --depth=1 'https://github.com/meaninggraph/core.git' "$core"
          git -C "$core_dir" checkout -q --detach "$core"
          cmp <("$RUNNER_TEMP/countries-tools/meaninggraph" schema) "$core_dir/meaning.schema.json"
          "$RUNNER_TEMP/countries-tools/meaninggraph" check model "$core_dir" --address github.com/demo-db/countries=model --graph "github.com/meaninggraph/core=$core_dir"

      - name: Publication front matter opts in to both descriptors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected = "---\novdb: 1\npublish:\n  - ./ovdb.yaml\n  - ./ovdb-database.json\n---\n"
          if not Path("OVDB.md").read_text(encoding="utf-8").startswith(expected):
              raise SystemExit("OVDB.md must opt in to both descriptors")
          PY

      - name: Generated files are committed and current
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::source, provider metadata or generated artifacts are stale"
            exit 1
          fi
